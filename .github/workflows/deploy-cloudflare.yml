name: Deploy Nodewarden to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nodewarden-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nodewarden-db --remote --config wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Set JWT secret
        run: printf '%s' '${{ secrets.JWT_SECRET }}' | npx wrangler secret put JWT_SECRET --config wrangler.toml
